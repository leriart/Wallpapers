name: Auto-update README

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.json'
      - 'generate_readme.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse — scripts + index only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            generate_readme.py
            docs/index.json
            README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate README from index
        run: python generate_readme.py --from-index

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update README with latest wallpapers"
            git push
          fi
